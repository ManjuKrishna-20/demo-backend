name: Build and Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/demo-backend
            git pull origin main
            export APP_VERSION=1.0.0
            export BUILD_NUMBER=$(date +%Y%m%d%H%M)
            export BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            sudo docker build \
              --build-arg APP_VERSION=$APP_VERSION \
              --build-arg BUILD_NUMBER=$BUILD_NUMBER \
              --build-arg BUILD_DATE=$BUILD_DATE \
              -t demo-backend:$APP_VERSION \
              -t demo-backend:build-$BUILD_NUMBER \
              -t demo-backend:latest \
              .
            sudo docker rm -f demo-backend-container || true
            sudo docker run -d \
              -p 8081:8080 \
              --name demo-backend-container \
              --restart unless-stopped \
              demo-backend:latest
